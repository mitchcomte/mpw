name: Recover MPW source baseline
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-mpw-source.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract recovered MPW source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="my-portland-wedding-v38.3.5-candlelight-noir-dense-vendor-discovery.zip"
          rm -rf .recover
          mkdir .recover
          unzip -q "$ZIP" -d .recover
          SRC="$(find .recover -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$SRC" ]; then SRC=".recover"; fi
          shopt -s dotglob
          for item in "$SRC"/*; do
            base="$(basename "$item")"
            [ "$base" = ".git" ] && continue
            [ "$base" = ".github" ] && continue
            cp -a "$item" ./
          done
          rm -rf .recover "$ZIP"
      - name: Commit recovered source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover MPW source baseline from archived ZIP"
          git push
