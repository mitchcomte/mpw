name: Recover MPW source baseline
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate and extract MPW project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP"
          rm -rf .recover
          mkdir .recover
          unzip -q "$ZIP" -d .recover
          PKG="$(find .recover -type f -name package.json -not -path '*/node_modules/*' -print -quit)"
          test -n "$PKG"
          SRC="$(dirname "$PKG")"
          echo "Detected MPW project root: $SRC"
          shopt -s dotglob nullglob
          for item in "$SRC"/*; do
            base="$(basename "$item")"
            [ "$base" = ".git" ] && continue
            [ "$base" = ".github" ] && continue
            [ "$base" = "README.md" ] && continue
            [ "$base" = ".env" ] && continue
            [ "$base" = "node_modules" ] && continue
            [ "$base" = ".next" ] && continue
            [ "$base" = ".vercel" ] && continue
            cp -a "$item" ./
          done
          rm -rf .recover "$ZIP"
      - name: Validate recovered project
        shell: bash
        run: |
          set -euo pipefail
          for f in package.json; do test -f "$f"; done
          for d in app components lib public supabase; do test -d "$d"; done
          test ! -f .env
          COUNT="$(find . -type f -not -path './.git/*' | wc -l)"
          echo "Recovered file count: $COUNT"
          test "$COUNT" -ge 250
      - name: Commit recovered source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover complete MPW source baseline"
          git push
